- title: "Average equilibration time for Gaussian unitary ensemble Hamiltonians"
  authors: "E. Schwarzhans, <u>A. Candeloro</u>, F. C. Binder, M. P. E. Lock, P. Bakhshinezhad"
  journal: "arXiv"
  year: 2026
  volume: "2603.28587"
  arxiv: "https://arxiv.org/abs/2603.28587"
  abstract: >
    Understanding equilibration times in closed quantum systems is essential for characterising their approach to equilibrium. Chaotic many-body systems are paradigmatic in this context: they are expected to thermalise according to the eigenstate thermalisation hypothesis and exhibit spectral properties well described by random matrix theory (RMT). While RMT successfully captures spectral correlations, its ability to provide quantitative predictions for equilibration timescales has remained largely unexplored. Here, we study equilibration within RMT using the framework of equilibration as dephasing, focusing on closed systems whose Hamiltonians are drawn from the Gaussian unitary ensemble (GUE). We derive an analytical expression that approximates the average equilibration time of the GUE and show that it is independent of both the initial state and the choice of observable, a consequence of the rotational invariance of the GUE. Numerical simulations confirm our analytical expression and demonstrate that our approximation is in close agreement with the true average equilibration time of the GUE. We find that the equilibration time decreases with system size and vanishes in the thermodynamic limit. This unphysical result indicates that the true equilibration timescale of realistic chaotic many-body systems must be dominated by physical features not captured by random matrix ensembles -- the GUE in particular.

- title: "Thermodynamic constraints on the emergence of intersubjectivity in quantum systems"
  authors: "<u>A. Candeloro</u>, T. Debarba, F. C. Binder"
  journal: "Physical Review A"
  year: 2026
  volume: "113, 032201"
  doi: "https://doi.org/10.1103/3312-b63x"
  abstract: >
    Ideal quantum measurement requires divergent thermodynamic resources. This is a consequence of the third law of thermodynamics, which prohibits the preparation of the measurement pointer in a fully erased, pure state required for the acquisition of perfect, noiseless measurement information. In this work, we investigate the consequences of finite resources in the emergence of intersubjectivity as a model for measurement processes with multiple observers. Here, intersubjectivity refers to a condition in which observers agree on the observed outcome (agreement), and their local random variables exactly reproduce the original random variable for the system observable (probability reproducibility). While agreement and reproducibility are mutually implied in the case of ideal measurement, finite thermodynamic resources constrain each of them. Starting from the third law of thermodynamics, we derive how the achievability of ideal intersubjectivity is affected by restricted thermodynamic resources. Specifically, we establish a no-go theorem concerning perfect intersubjectivity and present a deviation metric to account for the influence of limited resources. We further present attainable bounds for the agreement and bias that are exclusively dependent on the initial state of the environment. In addition, we show that either by cooling or coarse graining, we can approximate ideal intersubjectivity even with finite resources. This work bridges quantum thermodynamics and the emergence of classicality in the form of intersubjectivity.
  

- title: "Precision bounds for multiple currents in open quantum systems"
  authors: "S. V. Moreira, M. Radaelli, <u>A. Candeloro</u>, F. C. Binder, M. T. Mitchison"
  journal: "Physical Review E"
  year: 2025
  volume: "111, 064107"
  doi: "https://doi.org/10.1103/PhysRevE.111.064107"
  abstract: >
    Thermodynamic (TUR) and kinetic (KUR) uncertainty relations are fundamental bounds constraining the fluctuations of current observables in classical, nonequilibrium systems. Several works have verified, however, violations of these classical bounds in open quantum systems, motivating the derivation of new quantum TURs and KURs that account for the role of quantum coherence. Here, we go one step further by deriving multidimensional KUR and TUR for multiple observables in open quantum systems undergoing Markovian dynamics. Our derivation exploits a multiparameter metrology approach, in which the Fisher information matrix plays a central role. Crucially, our bounds are tighter than previously derived quantum TURs and KURs for single observables, precisely because they incorporate correlations between multiple observables. We also find an intriguing quantum signature of correlations that is captured by the off-diagonal element of the Fisher information matrix, which vanishes for classical stochastic dynamics. By considering two examples, namely a coherently driven qubit system and the three-level maser, we demonstrate that the multidimensional quantum KUR bound can even be saturated when the observables are perfectly correlated.


- title: "Dimension matters: precision and incompatibility in multi-parameter quantum estimation models"
  authors: "<u>A. Candeloro</u>, Z. Pazhotan, M. G. A. Paris"
  journal: "Quantum Science and Technology"
  year: 2024
  volume: "9, 045045"
  doi: "https://doi.org/10.1088/2058-9565/ad7498"
  abstract: >
    We study the role of probe dimension in determining the bounds of precision and the level of incompatibility in multi-parameter quantum estimation problems. In particular, we focus on the paradigmatic case of unitary encoding generated by su(2) and compare precision and incompatibility in the estimation of the same parameters across representations of different dimensions. For two- and three-parameter unitary models, we prove that if the dimension of the probe is smaller than the number of parameters, then simultaneous estimation is not possible (the quantum Fisher matrix is singular). If the dimension is equal to the number of parameters, estimation is possible but the model exhibits maximal (asymptotic) incompatibility. However, for larger dimensions, there is always a state for which the incompatibility vanishes, and the symmetric Cramér-Rao bound is achievable. We also critically examine the performance of the so-called asymptotic incompatibility (AI) in characterising the difference between the Holevo-Cramér-Rao bound and the Symmetric Logarithmic Derivative one, showing that the AI measure alone may fail to adequately quantify this gap. Assessing the determinant of the Quantum Fisher Information Matrix is crucial for a precise characterisation of the model’s nature. Nonetheless, the AI measure still plays a relevant role since it encapsulates the non-classicality of the model in one scalar quantity rather than in a matrix form (i.e. the Uhlmann curvature).



- title: "Feedback-Assisted Quantum Search by Continuous-Time Quantum Walks"
  authors: "<u>A. Candeloro</u>, C. Benedetti, M. G. Genoni, M. G. A. Paris"
  journal: "Advanced Quantum Technologies"
  year: 2023
  volume: "6, 2200093"
  doi: "https://doi.org/10.1002/qute.202200093"
  abstract: >
    The quantum search of a target node on a cycle graph by means of a quantum walk assisted by continuous measurement and feedback are addressed. Unlike previous spatial search approaches, where the oracle is described as a projector on the target state, a dynamical oracle implemented through a feedback Hamiltonian is considered. The idea is based on continuously monitoring the position of the quantum walker on the graph and then applying a unitary feedback operation based on the information obtained from measurement. The feedback changes the couplings between the nodes and it is optimized at each time via a numerical procedure. The stochastic trajectories describing the evolution for graphs of dimensions up to N=15 are numerically simulated, and the performance of the protocol is quantified via the average fidelity between the state of the walker and the target node. Different constraints on the control strategy are discussed. For unbounded controls, the protocol is able to quickly localize the walker on the target node. How the performance is lowered by posing an upper bound on the control couplings is then discussed. Finally, it is shown how a digital feedback protocol seems in general as efficient as the continuous bounded one.



