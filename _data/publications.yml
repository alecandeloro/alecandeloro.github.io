- title: "Average Equilibration Time for Gaussian Unitary Ensemble Hamiltonians"
  authors: "E. Schwarzhans, <u>A. Candeloro</u>, F. C. Binder, M. P. E. Lock, P. Bakhshinezhad"
  journal: "arXiv"
  year: 2026
  volume: "2603.28587"
  arxiv: "https://arxiv.org/abs/2603.28587"
  abstract: Understanding equilibration times in closed quantum systems is essential for characterising their approach to equilibrium. Chaotic many-body systems are paradigmatic in this context: they are expected to thermalise according to the eigenstate thermalisation hypothesis and exhibit spectral properties well described by random matrix theory (RMT). While RMT successfully captures spectral correlations, its ability to provide quantitative predictions for equilibration timescales has remained largely unexplored. Here, we study equilibration within RMT using the framework of equilibration as dephasing, focusing on closed systems whose Hamiltonians are drawn from the Gaussian unitary ensemble (GUE). We derive an analytical expression that approximates the average equilibration time of the GUE and show that it is independent of both the initial state and the choice of observable, a consequence of the rotational invariance of the GUE. Numerical simulations confirm our analytical expression and demonstrate that our approximation is in close agreement with the true average equilibration time of the GUE. We find that the equilibration time decreases with system size and vanishes in the thermodynamic limit. This unphysical result indicates that the true equilibration timescale of realistic chaotic many-body systems must be dominated by physical features not captured by random matrix ensembles -- the GUE in particular.


- title: "Thermodynamic Constraints on the Emergence of Intersubjectivity in Quantum Systems"
  authors: "<u>A. Candeloro</u>, T. Debarba, F. C. Binder"
  journal: "Physical Review A"
  year: 2026
  volume: "113, 032201"
  doi: "https://doi.org/10.1103/3312-b63x"
  abstact: Ideal quantum measurement requires divergent thermodynamic resources. This is a consequence of the third law of thermodynamics, which prohibits the preparation of the measurement pointer in a fully erased, pure state required for the acquisition of perfect, noiseless measurement information. In this work, we investigate the consequences of finite resources in the emergence of intersubjectivity as a model for measurement processes with multiple observers. Here, intersubjectivity refers to a condition in which observers agree on the observed outcome (agreement), and their local random variables exactly reproduce the original random variable for the system observable (probability reproducibility). While agreement and reproducibility are mutually implied in the case of ideal measurement, finite thermodynamic resources constrain each of them. Starting from the third law of thermodynamics, we derive how the achievability of ideal intersubjectivity is affected by restricted thermodynamic resources. Specifically, we establish a no-go theorem concerning perfect intersubjectivity and present a deviation metric to account for the influence of limited resources. We further present attainable bounds for the agreement and bias that are exclusively dependent on the initial state of the environment. In addition, we show that either by cooling or coarse graining, we can approximate ideal intersubjectivity even with finite resources. This work bridges quantum thermodynamics and the emergence of classicality in the form of intersubjectivity.
  

