- title: "Average equilibration time for Gaussian unitary ensemble Hamiltonians"
  authors: "E. Schwarzhans, <u>A. Candeloro</u>, F. C. Binder, M. P. E. Lock, P. Bakhshinezhad"
  journal: "arXiv"
  year: 2026
  volume: "2603.28587"
  arxiv: "https://arxiv.org/abs/2603.28587"
  abstract: >
    Understanding equilibration times in closed quantum systems is essential for characterising their approach to equilibrium. Chaotic many-body systems are paradigmatic in this context: they are expected to thermalise according to the eigenstate thermalisation hypothesis and exhibit spectral properties well described by random matrix theory (RMT). While RMT successfully captures spectral correlations, its ability to provide quantitative predictions for equilibration timescales has remained largely unexplored. Here, we study equilibration within RMT using the framework of equilibration as dephasing, focusing on closed systems whose Hamiltonians are drawn from the Gaussian unitary ensemble (GUE). We derive an analytical expression that approximates the average equilibration time of the GUE and show that it is independent of both the initial state and the choice of observable, a consequence of the rotational invariance of the GUE. Numerical simulations confirm our analytical expression and demonstrate that our approximation is in close agreement with the true average equilibration time of the GUE. We find that the equilibration time decreases with system size and vanishes in the thermodynamic limit. This unphysical result indicates that the true equilibration timescale of realistic chaotic many-body systems must be dominated by physical features not captured by random matrix ensembles -- the GUE in particular.

- title: "Thermodynamic constraints on the emergence of intersubjectivity in quantum systems"
  authors: "<u>A. Candeloro</u>, T. Debarba, F. C. Binder"
  journal: "Physical Review A"
  year: 2026
  volume: "113, 032201"
  doi: "https://doi.org/10.1103/3312-b63x"
  abstract: >
    Ideal quantum measurement requires divergent thermodynamic resources. This is a consequence of the third law of thermodynamics, which prohibits the preparation of the measurement pointer in a fully erased, pure state required for the acquisition of perfect, noiseless measurement information. In this work, we investigate the consequences of finite resources in the emergence of intersubjectivity as a model for measurement processes with multiple observers. Here, intersubjectivity refers to a condition in which observers agree on the observed outcome (agreement), and their local random variables exactly reproduce the original random variable for the system observable (probability reproducibility). While agreement and reproducibility are mutually implied in the case of ideal measurement, finite thermodynamic resources constrain each of them. Starting from the third law of thermodynamics, we derive how the achievability of ideal intersubjectivity is affected by restricted thermodynamic resources. Specifically, we establish a no-go theorem concerning perfect intersubjectivity and present a deviation metric to account for the influence of limited resources. We further present attainable bounds for the agreement and bias that are exclusively dependent on the initial state of the environment. In addition, we show that either by cooling or coarse graining, we can approximate ideal intersubjectivity even with finite resources. This work bridges quantum thermodynamics and the emergence of classicality in the form of intersubjectivity.
  

- title: "Precision bounds for multiple currents in open quantum systems"
  authors: "S. V. Moreira, M. Radaelli, <u>A. Candeloro</u>, F. C. Binder, M. T. Mitchison"
  journal: "Physical Review E"
  year: 2025
  volume: "111, 064107"
  doi: "https://doi.org/10.1103/PhysRevE.111.064107"
  abstract: >
    Thermodynamic (TUR) and kinetic (KUR) uncertainty relations are fundamental bounds constraining the fluctuations of current observables in classical, nonequilibrium systems. Several works have verified, however, violations of these classical bounds in open quantum systems, motivating the derivation of new quantum TURs and KURs that account for the role of quantum coherence. Here, we go one step further by deriving multidimensional KUR and TUR for multiple observables in open quantum systems undergoing Markovian dynamics. Our derivation exploits a multiparameter metrology approach, in which the Fisher information matrix plays a central role. Crucially, our bounds are tighter than previously derived quantum TURs and KURs for single observables, precisely because they incorporate correlations between multiple observables. We also find an intriguing quantum signature of correlations that is captured by the off-diagonal element of the Fisher information matrix, which vanishes for classical stochastic dynamics. By considering two examples, namely a coherently driven qubit system and the three-level maser, we demonstrate that the multidimensional quantum KUR bound can even be saturated when the observables are perfectly correlated.


- title: "Dimension matters: precision and incompatibility in multi-parameter quantum estimation models"
  authors: "<u>A. Candeloro</u>, Z. Pazhotan, M. G. A. Paris"
  journal: "Quantum Science and Technology"
  year: 2024
  volume: "9, 045045"
  doi: "https://doi.org/10.1088/2058-9565/ad7498"
  abstract: >
    We study the role of probe dimension in determining the bounds of precision and the level of incompatibility in multi-parameter quantum estimation problems. In particular, we focus on the paradigmatic case of unitary encoding generated by su(2) and compare precision and incompatibility in the estimation of the same parameters across representations of different dimensions. For two- and three-parameter unitary models, we prove that if the dimension of the probe is smaller than the number of parameters, then simultaneous estimation is not possible (the quantum Fisher matrix is singular). If the dimension is equal to the number of parameters, estimation is possible but the model exhibits maximal (asymptotic) incompatibility. However, for larger dimensions, there is always a state for which the incompatibility vanishes, and the symmetric Cramér-Rao bound is achievable. We also critically examine the performance of the so-called asymptotic incompatibility (AI) in characterising the difference between the Holevo-Cramér-Rao bound and the Symmetric Logarithmic Derivative one, showing that the AI measure alone may fail to adequately quantify this gap. Assessing the determinant of the Quantum Fisher Information Matrix is crucial for a precise characterisation of the model’s nature. Nonetheless, the AI measure still plays a relevant role since it encapsulates the non-classicality of the model in one scalar quantity rather than in a matrix form (i.e. the Uhlmann curvature).



- title: "Feedback-Assisted Quantum Search by Continuous-Time Quantum Walks"
  authors: "<u>A. Candeloro</u>, C. Benedetti, M. G. Genoni, M. G. A. Paris"
  journal: "Advanced Quantum Technologies"
  year: 2023
  volume: "6, 2200093"
  doi: "https://doi.org/10.1002/qute.202200093"
  abstract: >
    The quantum search of a target node on a cycle graph by means of a quantum walk assisted by continuous measurement and feedback are addressed. Unlike previous spatial search approaches, where the oracle is described as a projector on the target state, a dynamical oracle implemented through a feedback Hamiltonian is considered. The idea is based on continuously monitoring the position of the quantum walker on the graph and then applying a unitary feedback operation based on the information obtained from measurement. The feedback changes the couplings between the nodes and it is optimized at each time via a numerical procedure. The stochastic trajectories describing the evolution for graphs of dimensions up to N=15 are numerically simulated, and the performance of the protocol is quantified via the average fidelity between the state of the walker and the target node. Different constraints on the control strategy are discussed. For unbounded controls, the protocol is able to quickly localize the walker on the target node. How the performance is lowered by posing an upper bound on the control couplings is then discussed. Finally, it is shown how a digital feedback protocol seems in general as efficient as the continuous bounded one.



- title: "On the properties of the asymptotic incompatibility measure in multiparameter quantum estimation"
  authors: "<u>A. Candeloro</u>, M. G. A. Paris, M. G. Genoni"
  journal: "Journal of Physics A: Mathematical and Theoretical"
  year: 2021
  volume: "54, 485301"
  doi: "https://doi.org/10.1088/1751-8121/ac331e"
  abstract: >
    We address the use of asymptotic incompatibility (AI) to assess the quantumness of a multiparameter quantum statistical model. AI is a recently introduced measure which quantifies the difference between the Holevo and the symmetric logarithmic derivative (SLD) scalar bounds, and can be evaluated using only the SLD operators of the model. At first, we evaluate analytically the AI of the most general quantum statistical models involving two-level (qubit) and single-mode Gaussian continuous-variable quantum systems, and prove that AI is a simple monotonous function of the state purity. Then, we numerically investigate the same problem for qudits (d-dimensional quantum systems, with 2 < d ⩽ 4), showing that, while in general AI is not in general a function of purity, we have enough numerical evidence to conclude that the maximum amount of AI is attainable only for quantum statistical models characterized by a purity larger than mumin = 1/(d-1). In addition, by parametrizing qudit states as thermal (Gibbs) states, numerical results suggest that, once the spectrum of the Hamiltonian is fixed, the AI measure is in one-to-one correspondence with the fictitious temperature parameter β characterizing the family of density operators. Finally, by studying in detail the definition and properties of the AI measure we find that: (i) given a quantum statistical model, one can readily identify the maximum number of asymptotically compatible parameters; (ii) the AI of a quantum statistical model bounds from above the AI of any sub-model that can be defined by fixing one or more of the original unknown parameters (or functions thereof), leading to possibly useful bounds on the AI of models involving noisy quantum dynamics.
    

- title: "Quantum Probes for the Characterization of Nonlinear Media"
  authors: "<u>A. Candeloro</u>, S. Razavian, M. Piccolini, B. Teklu, S. Olivares, M. G. A. Paris"
  journal: "Entropy"
  year: 2021
  volume: "23, 1353"
  doi: "https://doi.org/10.3390/e23101353"
  abstract: >
    Active optical media leading to interaction Hamiltonians of the form 𝐻=𝜆˜(𝑎+𝑎†)𝜁 represent a crucial resource for quantum optical technology. In this paper, we address the characterization of those nonlinear media using quantum probes, as opposed to semiclassical ones. In particular, we investigate how squeezed probes may improve individual and joint estimation of the nonlinear coupling 𝜆˜ and of the nonlinearity order 𝜁. Upon using tools from quantum estimation, we show that: (i) the two parameters are compatible, i.e., the may be jointly estimated without additional quantum noise; (ii) the use of squeezed probes improves precision at fixed overall energy of the probe; (iii) for low energy probes, squeezed vacuum represent the most convenient choice, whereas for increasing energy an optimal squeezing fraction may be determined; (iv) using optimized quantum probes, the scaling of the corresponding precision with energy improves, both for individual and joint estimation of the two parameters, compared to semiclassical coherent probes. We conclude that quantum probes represent a resource to enhance precision in the characterization of nonlinear media, and foresee potential applications with current technology.


- title: "An Enhanced Photonic Quantum Finite Automaton"
  authors: "<u>A. Candeloro</u>, C. Mereghetti, B. Palano, S. Cialdi, M. G. A. Paris, S. Olivares"
  journal: "Applied Sciences"
  year: 2021
  volume: "11, 8768"
  doi: "https://doi.org/10.3390/app11188768"
  abstrac: >
    In a recent paper we have described an optical implementation of a measure-once one-way quantum finite automaton recognizing a well-known family of unary periodic languages, accepting words not in the language with a given error probability. To process input words, the automaton exploits the degree of polarization of single photons and, to reduce the acceptance error probability, a technique of confidence amplification using the photon counts is implemented. In this paper, we show that the performance of this automaton may be further improved by using strategies that suitably consider both the orthogonal output polarizations of the photon. In our analysis, we also take into account how detector dark counts may affect the performance of the automaton.


- title: "Role of topology in determining the precision of a finite thermometer"
  authors: "<u>A. Candeloro</u>, L. Razzoli, P. Bordone, M. G. A. Paris"
  journal: "Physical Review E"
  year: 2021
  volume: "104, 014136"
  doi: "https://doi.org/10.1103/PhysRevE.104.014136"
  abstract: >
    Temperature fluctuations of a finite system follow the Landau bound 𝛿⁢𝑇2=𝑇2/𝐶⁡(𝑇) where 𝐶⁡(𝑇) is the heat capacity of the system. In turn, the same bound sets a limit to the precision of temperature estimation when the system itself is used as a thermometer. In this paper, we employ graph theory and the concept of Fisher information to assess the role of topology on the thermometric performance of a given system. We find that low connectivity is a resource to build precise thermometers working at low temperatures, whereas highly connected systems are suitable for higher temperatures. Upon modeling the thermometer as a set of vertices for the quantum walk of an excitation, we compare the precision achievable by position measurement to the optimal one, which itself corresponds to energy measurement.



- title: "Discrimination of Ohmic thermal baths by quantum dephasing probes"
  authors: "<u>A. Candeloro</u>, M. G. A. Paris"
  journal: "Physical Review A"
  year: 2021
  volume: "103, 012217"
  doi: "https://doi.org/10.1103/PhysRevA.103.012217"
  abstract: >
    We address the discrimination of structured baths at different temperatures by dephasing quantum probes. We derive the exact reduced dynamics and evaluate the minimum error probability achievable by three different kinds of quantum probes, namely, a qubit, a qutrit, and a quantum register made of two qubits. Our results indicate that dephasing quantum probes are useful in discriminating low values of temperature and that lower probabilities of error are achieved for intermediate values of the interaction time, where the minimum probability of error scales as 1/2⁢𝑁, with 𝑁 the number of energy levels of the probe. A qutrit probe outperforms a qubit one in the discrimination task, whereas entangled probes show smaller optimal times.



- title: "Continuous-time quantum walks in the presence of a quadratic perturbation"
  authors: "<u>A. Candeloro</u>, L. Razzoli, S. Cavazzoni, P. Bordone, M. G. A. Paris"
  journal: "Physical Review A"
  year: 2020
  volume: "102, 042214"
  doi: "https://doi.org/10.1103/PhysRevA.102.042214"
  abstract: >
    We address the properties of continuous-time quantum walks with Hamiltonians of the form ℋ=𝐿+𝜆⁢𝐿2, with 𝐿 the Laplacian matrix of the underlying graph and the perturbation 𝜆⁢𝐿2 motivated by its potential use to introduce next-nearest-neighbor hopping. We consider cycle, complete, and star graphs as paradigmatic models with low and high connectivity and/or symmetry. First, we investigate the dynamics of an initially localized walker. Then we devote attention to estimating the perturbation parameter 𝜆 using only a snapshot of the walker dynamics. Our analysis shows that a walker on a cycle graph spreads ballistically independently of the perturbation, whereas on complete and star graphs one observes perturbation-dependent revivals and strong localization phenomena. Concerning the estimation of the perturbation, we determine the walker preparations and the simple graphs that maximize the quantum Fisher information. We also assess the performance of position measurement, which turns out to be optimal, or nearly optimal, in several situations of interest. Besides fundamental interest, our study may find applications in designing enhanced algorithms on graphs.

- title: "Quantum probes for universal gravity corrections"
  authors: "<u>A. Candeloro</u>, C. D. E. Boschi, M. G. A. Paris"
  journal: "Physical Review D"
  year: 2020
  volume: "102, 056012"
  doi: "https://doi.org/10.1103/PhysRevD.102.056012"
  abstract: >
    We address the precision of the estimation procedures for the minimum length arising from gravitational theories. In particular, we provide bounds on precision and assess the use of quantum probes to enhance the estimation performance. At first, we review the concept of minimum length and how it induces a perturbative term appearing in the Hamiltonian of any quantum system, which itself is proportional to a parameter depending on the minimum length. We then systematically study the effects of this perturbation on different state preparations and for several one-dimensional systems, and evaluate the quantum Fisher information in order to find the ultimate bounds to precision. Eventually, we investigate the role of dimensionality by analyzing the use of two-dimensional square well and harmonic oscillator systems to probe the minimal length. Our results show that quantum probes are convenient resources, providing potential enhancement in precision. Additionally, our results provide a set of guidelines to design future experiments to detect the minimum length.
